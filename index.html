<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface-2:#F5F7FA;--surface-3:#E7EBF1;
  --ink:#0E1A2B;--ink-2:#43506A;--muted:#647086;
  --line:#DAE0E8;--line-2:#C4CCD8;
  --navy:#13294B;--navy-2:#1D3764;--on-navy:#FFFFFF;--on-navy-2:#C0CBDF;--on-navy-3:#93A3C1;
  --navy-chip:rgba(255,255,255,.07);--navy-chip-line:rgba(255,255,255,.17);
  --gold:#FFC532;--gold-soft:#FFEBB0;--on-gold:#13294B;
  --primary:#13294B;--primary-hover:#1D3764;--on-primary:#FFFFFF;
  --tab-active:#13294B;
  --tag-bg:#FFF2C4;--tag-ink:#5B4300;--tag-line:#EBCF72;
  --focus:#2a78d6;
  --in:#1baf7a;--in-soft:#DCF3EA;--out:#eb6834;--out-soft:#FCE5DA;--adj:#5A6A86;--adj-soft:#E4E9F1;--stock:#2a78d6;
  --grid:#E5E9EF;--axis:#C4CCD8;--hl:rgba(19,41,75,.06);
  --good:#0ca30c;--good-ink:#006300;
  --warn:#fab219;--warn-ink:#7A5200;--warn-bg:#FFF1CF;
  --crit:#d03b3b;--crit-ink:#AE2323;--crit-bg:#FBE4E4;
  --toast-bg:#0E1A2B;--toast-ink:#FFFFFF;--toast-act:#FFC532;
  --scrim:rgba(9,17,31,.5);
  --shadow-1:0 1px 2px rgba(14,26,43,.05),0 1px 6px rgba(14,26,43,.04);
  --shadow-2:0 12px 36px rgba(14,26,43,.22);
  --font:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tabbar-h:66px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A111D;--surface:#121B2B;--surface-2:#172235;--surface-3:#1E2B41;
    --ink:#EDF2F9;--ink-2:#B5C0D1;--muted:#8793A9;
    --line:#233049;--line-2:#34435F;
    --navy:#0F1F3B;--navy-2:#18305A;--on-navy:#FFFFFF;--on-navy-2:#AFBDD6;--on-navy-3:#8193B3;
    --navy-chip:rgba(255,255,255,.06);--navy-chip-line:rgba(255,255,255,.14);
    --gold:#FFC532;--gold-soft:#4A3B0E;--on-gold:#13294B;
    --primary:#FFC532;--primary-hover:#FFD35E;--on-primary:#13294B;
    --tab-active:#FFC532;
    --tag-bg:#3A3114;--tag-ink:#FFD76E;--tag-line:#5B4B1D;
    --focus:#6DA7EC;
    --in:#199e70;--in-soft:#0F2E24;--out:#d95926;--out-soft:#3A1F14;--adj:#9AA8C0;--adj-soft:#1F2A3F;--stock:#3987e5;
    --grid:#1E293C;--axis:#34435F;--hl:rgba(255,255,255,.05);
    --good-ink:#46CF46;
    --warn-ink:#FFC94D;--warn-bg:#3A2E0F;
    --crit-ink:#FF8E8E;--crit-bg:#3E1719;
    --toast-bg:#E9EEF6;--toast-ink:#0E1A2B;--toast-act:#13294B;
    --scrim:rgba(0,0,0,.62);
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 14px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A111D;--surface:#121B2B;--surface-2:#172235;--surface-3:#1E2B41;
  --ink:#EDF2F9;--ink-2:#B5C0D1;--muted:#8793A9;
  --line:#233049;--line-2:#34435F;
  --navy:#0F1F3B;--navy-2:#18305A;--on-navy:#FFFFFF;--on-navy-2:#AFBDD6;--on-navy-3:#8193B3;
  --navy-chip:rgba(255,255,255,.06);--navy-chip-line:rgba(255,255,255,.14);
  --gold:#FFC532;--gold-soft:#4A3B0E;--on-gold:#13294B;
  --primary:#FFC532;--primary-hover:#FFD35E;--on-primary:#13294B;
  --tab-active:#FFC532;
  --tag-bg:#3A3114;--tag-ink:#FFD76E;--tag-line:#5B4B1D;
  --focus:#6DA7EC;
  --in:#199e70;--in-soft:#0F2E24;--out:#d95926;--out-soft:#3A1F14;--adj:#9AA8C0;--adj-soft:#1F2A3F;--stock:#3987e5;
  --grid:#1E293C;--axis:#34435F;--hl:rgba(255,255,255,.05);
  --good-ink:#46CF46;
  --warn-ink:#FFC94D;--warn-bg:#3A2E0F;
  --crit-ink:#FF8E8E;--crit-bg:#3E1719;
  --toast-bg:#E9EEF6;--toast-ink:#0E1A2B;--toast-act:#13294B;
  --scrim:rgba(0,0,0,.62);
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 14px 40px rgba(0,0,0,.55);
}

/* ---------- base ---------- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--navy)}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html:has(dialog[open]){overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:grid;gap:16px}
.link{border:0;background:none;padding:6px 0;color:var(--ink-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.link.danger{color:var(--crit-ink)}

/* ---------- header (navy control zone) ---------- */
.hero{background:var(--navy);color:var(--on-navy);padding:18px 16px 12px}
.hero-inner,.bar-inner,.wrap-inner{max-width:1080px;margin-inline:auto}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;flex:none}
.brand-name{font-size:18px;font-weight:700;line-height:1.2;letter-spacing:.005em}
.brand-sub{font-size:12.5px;color:var(--on-navy-2);line-height:1.35}
.icon-btn{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:transparent;color:inherit;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn.on-navy{background:var(--navy-chip);color:var(--on-navy)}
.icon-btn.on-navy:hover{background:rgba(255,255,255,.14)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;color:var(--muted)}
.hero-stats{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:14px;font-size:13px;color:var(--on-navy-2)}
.hero-stats b{color:var(--on-navy);font-size:19px;font-weight:600;margin-right:5px}
.hero-stats .alert b{color:var(--gold)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);padding:2px 16px 12px}
.bar-inner{display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 12px;border-radius:13px;background:var(--surface);color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--gold)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .icon-btn{width:34px;height:34px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--navy-chip-line);background:var(--navy-chip);color:var(--on-navy-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.12)}
.chip .n{font-size:12.5px;color:var(--on-navy-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.chip[aria-pressed="true"] .n{color:var(--on-gold);opacity:.72}
.chip-sep{flex:none;width:1px;margin-block:7px;background:var(--navy-chip-line)}

/* ---------- views ---------- */
.view{padding-bottom:calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom,0px))}
.wrap{padding-inline:16px}
.banner{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:13.5px}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px 2px;font-size:13px;color:var(--ink-2)}
.select-wrap{position:relative;display:inline-block}
.select-wrap::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;margin-top:-5px;border:solid var(--muted);border-width:0 1.6px 1.6px 0;transform:rotate(45deg);pointer-events:none}
.select-mini{appearance:none;-webkit-appearance:none;height:34px;padding:0 30px 0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.5px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 2px 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.group-h .num{font-weight:500;color:var(--muted)}

/* ---------- item cards ---------- */
.items{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));margin-top:10px}
.group-h+.items{margin-top:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-1);overflow:hidden}
.item-open{display:flex;gap:12px;align-items:flex-start;min-width:0;padding:12px 8px 12px 12px;border:0;background:transparent;text-align:left}
.item-open:hover{background:var(--surface-2)}
.thumb{flex:none;display:grid;place-items:center;overflow:hidden;border-radius:10px;background:var(--surface-3);color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.item-main{display:grid;gap:5px;justify-items:start;min-width:0;padding-top:1px}
.item-name{font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;font-size:12.5px;color:var(--muted);min-width:0}
.code{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--ink-2);overflow-wrap:anywhere}
.cat-s{font-size:12.5px;color:var(--muted)}
.bin{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:1px 8px 1px 6px;border:1px solid var(--tag-line);border-radius:4px 7px 7px 4px;background:var(--tag-bg);color:var(--tag-ink);font-size:12px;font-weight:600;line-height:1.55;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bin::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--tag-line)}
.item-side{display:grid;align-content:space-between;justify-items:end;gap:10px;padding:12px 12px 12px 4px}
.qty{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.qty-n{font-size:23px;font-weight:600;line-height:1}
.qty-u{font-size:12.5px;color:var(--muted)}
.steppers{display:flex;border:1px solid var(--line-2);border-radius:11px;overflow:hidden}
.steppers button{width:42px;height:36px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.steppers button+button{border-left:1px solid var(--line-2)}
.steppers button:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 5px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.65;white-space:nowrap}
.pill.low{background:var(--warn-bg);color:var(--warn-ink)}
.pill.out,.pill.neg{background:var(--crit-bg);color:var(--crit-ink)}
.pill.ok{background:var(--surface-3);color:var(--ink-2);padding-left:9px}
.st-warn{fill:var(--warn)}
.st-crit{fill:var(--crit)}
.chip .st{margin-left:-3px}

/* skeleton + empty */
.sk{min-height:86px;display:flex;gap:12px;padding:12px;align-items:center}
.sk-thumb{width:60px;height:60px;border-radius:10px;background:var(--surface-3)}
.sk-lines{flex:1;display:grid;gap:8px}
.sk-lines i{display:block;height:11px;border-radius:6px;background:var(--surface-3)}
.sk-lines i+i{width:55%}
.empty{display:grid;justify-items:center;text-align:center;gap:12px;margin:22px auto 0;max-width:460px;padding:26px 20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.empty.small{padding:22px 18px;gap:10px}
.empty h2{font-size:19px;font-weight:700}
.empty p{color:var(--ink-2);font-size:14.5px;max-width:34ch}
.empty-art{width:150px;height:auto}
.ea-post,.ea-shelf{fill:var(--line-2)}
.ea-box{fill:var(--surface-3);stroke:var(--line-2);stroke-width:1.5}
.ea-slot{fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:4 3}
.ea-gold{fill:var(--gold)}
.ea-plus{stroke:var(--on-gold);stroke-width:3;stroke-linecap:round;fill:none}
.steps{list-style:none;counter-reset:s;margin:4px 0 6px;padding:0;display:grid;gap:10px;text-align:left;width:100%}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;column-gap:10px;align-items:start}
.steps li::before{content:counter(s);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps b{font-size:14.5px}
.steps span{grid-column:2;font-size:13.5px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;text-align:center;line-height:1.25}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{filter:brightness(1.04)}
.btn.block{flex:1}
.btn.sm{min-height:38px;padding:0 13px;border-radius:11px;font-size:14px}
.btn.danger-solid{background:var(--crit);border-color:var(--crit);color:#fff}
.btn:disabled{opacity:.5}
.btn.big{min-height:60px;border-radius:15px;font-size:16px;flex:1}
.btn.big.in .ic{color:var(--in)}
.btn.big.out .ic{color:var(--out)}

/* ---------- FAB + tab bar + toast ---------- */
.fab{position:fixed;z-index:30;right:max(16px,calc((100vw - 1080px) / 2 + 16px));bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 17px;border:0;border-radius:17px;background:var(--gold);color:var(--on-gold);font-size:15.5px;font-weight:700;box-shadow:0 8px 22px rgba(19,41,75,.3)}
.fab:hover{filter:brightness(1.04)}
.tabbar{position:fixed;z-index:40;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tabbar-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:520px}
.tab{display:grid;justify-items:center;gap:2px;padding:4px 4px 2px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500}
.tab-ico{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
.tab[aria-current="page"]{color:var(--tab-active);font-weight:700}
.tab[aria-current="page"] .tab-ico{background:var(--gold-soft)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 32px);padding:10px 8px 10px 16px;border-radius:14px;background:var(--toast-bg);color:var(--toast-ink);font-size:14px;box-shadow:var(--shadow-2)}
.toast.in-sheet{position:absolute;bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.toast-msg{min-width:0;overflow-wrap:anywhere}
.toast-act{flex:none;border:0;background:transparent;color:var(--toast-act);font-weight:700;padding:8px 10px;border-radius:9px}

/* ---------- sheet (dialog) ---------- */
dialog.sheet{position:fixed;display:flex;flex-direction:column;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;margin:auto auto 0;padding:0;border:0;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-2);overflow:hidden}
dialog.sheet:not([open]){display:none}
dialog.sheet::backdrop{background:var(--scrim)}
dialog.sheet[open]{animation:sheet-up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet-up{from{transform:translateY(28px);opacity:.4}}
@media (min-width:720px){dialog.sheet{margin:auto;border-radius:22px;max-height:88vh;max-height:88dvh}}
@media (prefers-reduced-motion:reduce){dialog.sheet[open]{animation:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:16px 8px 10px 18px;flex:none;position:relative}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line-2)}
@media (min-width:720px){.sheet-head::before{display:none}}
.sheet-title{flex:1;min-width:0;font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;outline:none}
.sheet-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 22px}
.sheet-foot{flex:none;display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}

/* detail */
.d-photo{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;max-height:42vh;width:100%;border-radius:16px;overflow:hidden;background:var(--surface-3);color:var(--muted)}
.d-photo img{width:100%;height:100%;object-fit:contain}
.d-photo.empty{aspect-ratio:auto;height:128px;gap:6px;align-content:center;font-size:14px;font-weight:500}
.d-photo.add{position:relative;border:1.5px dashed var(--line-2);background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.file-cover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.d-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cat-badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);font-size:12.5px;font-weight:600}
.d-qty{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.d-qty-n{font-size:40px;font-weight:600;line-height:1}
.d-qty-u{font-size:16px;font-weight:500;color:var(--ink-2)}
.d-qty-l{margin-top:6px;font-size:13px;color:var(--muted)}
.d-qty-side{display:grid;justify-items:end;gap:6px;text-align:right}
.d-actions{display:flex;gap:10px}
.d-actions2{display:flex;flex-wrap:wrap;gap:8px}
.d-actions2 .btn{flex:1}
.d-note{padding:12px 14px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.d-h{font-size:15px;font-weight:700;margin-bottom:-6px}
.d-h small{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
.d-foot{font-size:12.5px;color:var(--muted)}
.del-box{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--crit-bg);color:var(--crit-ink);font-size:14px}
.del-box .row-btns{display:flex;gap:8px}
.del-box .btn{flex:1}
.info-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px}
.tbl-scroll{overflow-x:auto;margin-inline:-4px}
.card-table{width:100%;border-collapse:collapse;font-size:13px}
.card-table th{padding:8px 5px;border-bottom:1px solid var(--line-2);text-align:left;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.card-table td{padding:9px 5px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}
.card-table .n{text-align:right;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card-table .b{font-weight:600}
.card-table .dt{white-space:nowrap;color:var(--ink-2);font-size:12.5px;line-height:1.35}
.card-table .desc{min-width:9em;line-height:1.4}
.card-table .desc small{display:block;color:var(--muted);font-size:12px}
.card-table tr.void td{color:var(--muted)}
.card-table tr.void .strike{text-decoration:line-through}
.void-tag{display:inline-block;padding:0 7px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);font-size:11.5px;font-weight:600;text-decoration:none}

/* move sheet */
.m-item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.m-name{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:13px;background:var(--surface-3)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 6px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg button[data-mtype="in"][aria-pressed="true"] .ic{color:var(--in)}
.seg button[data-mtype="out"][aria-pressed="true"] .ic{color:var(--out)}
.seg.sm button{min-height:34px;font-size:13px;padding:0 10px}
.stepper{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;gap:8px}
.stepper button{height:58px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.stepper button:hover{background:var(--surface-2)}
.stepper .input{height:58px;text-align:center;font-size:28px;font-weight:600;background:var(--surface-2)}
.m-preview{min-height:1.5em;font-size:14px;color:var(--ink-2)}
.m-preview b{color:var(--ink)}
.form-err{min-height:0;font-size:14px;font-weight:600;color:var(--crit-ink)}
.form-err:empty{display:none}

/* form */
.field{display:grid;gap:6px;min-width:0}
.lab{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.lab .opt{font-weight:400;color:var(--muted);margin-left:4px}
.req{color:var(--crit-ink)}
.input{width:100%;min-height:48px;padding:10px 13px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface);color:var(--ink);font-size:16px;line-height:1.4}
.input::placeholder{color:var(--muted)}
.input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
textarea.input{resize:vertical;min-height:72px}
select.input{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted)}
.f-photo{display:flex;gap:14px;align-items:center}
.photo-pick{position:relative;flex:none;display:grid;place-items:center;width:104px;height:104px;border:1.5px dashed var(--line-2);border-radius:16px;background:var(--surface-2);color:var(--ink-2);overflow:hidden;cursor:pointer}
.photo-pick.has{border-style:solid}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.f-photo-t{display:grid;gap:3px;justify-items:start;min-width:0}
.f-photo-t b{font-size:15px}
.f-photo-t .link{padding:2px 0}

/* settings */
.cat-list{display:grid;gap:8px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}
.cat-row .input{min-height:44px}
.cat-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.cat-add .input{min-height:46px}
.del-list{display:grid;gap:8px}
.del-row{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:12px}
.del-t{flex:1;min-width:0}
.del-name{font-weight:600;overflow-wrap:anywhere}

/* ---------- history ---------- */
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 2px 8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.day-h .sum{font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 8px 12px 12px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hico{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;margin-top:2px}
.hico.in,.hico.open{background:var(--in-soft);color:var(--in)}
.hico.out{background:var(--out-soft);color:var(--out)}
.hico.adj{background:var(--adj-soft);color:var(--adj)}
.hmain{display:grid;gap:2px;justify-items:start;min-width:0;padding:0;border:0;background:none;text-align:left}
.h-name{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.h-type{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.h-meta{font-size:12.5px;color:var(--muted)}
.hside{display:flex;align-items:flex-start;gap:2px}
.kebab-space{flex:none;width:34px}
.hq{display:grid;justify-items:end;padding-top:2px}
.h-qty{font-size:17px;font-weight:600;line-height:1.2}
.h-unit{font-size:12px;color:var(--muted)}
.hrow.void .h-name,.hrow.void .h-qty{text-decoration:line-through;color:var(--muted)}
.hconfirm{grid-column:1/-1;display:grid;gap:10px;margin-top:8px;padding:12px;border-radius:12px;background:var(--crit-bg);color:var(--crit-ink);font-size:14px}
.hconfirm .row-btns{display:flex;gap:8px}
.hconfirm .btn{flex:1}
.tag-mini{display:inline-block;padding:0 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);font-size:11.5px;font-weight:600;vertical-align:1px}
.more-row{display:flex;justify-content:center;margin-top:14px}

/* ---------- dashboard ---------- */
.dash-hero-fig{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-top:18px}
.hero-fig{font-size:56px;font-weight:600;line-height:1;letter-spacing:-.01em}
.hero-fig-lab{font-size:16px;font-weight:500;color:var(--on-navy-2)}
.hero-sub{margin-top:8px;font-size:13.5px;color:var(--on-navy-2)}
.hero-sub b{color:var(--on-navy);font-weight:600}
.dash-grid{display:grid;gap:0 22px}
.dash-col{display:grid;align-content:start;min-width:0}
@media (min-width:900px){.dash-grid{grid-template-columns:1fr 1fr}}
.section{margin-top:24px;display:grid;gap:12px;align-content:start;min-width:0}
.section-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px}
.section-h h2{font-size:17px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:3px;align-content:start;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-align:left}
button.tile:hover{background:var(--surface-2)}
.t-lab{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.t-val{font-size:30px;font-weight:600;line-height:1.15}
.t-sub{font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.sw.in{background:var(--in)}
.sw.out{background:var(--out)}
.sw.stock{background:var(--stock)}
.panel{min-width:0;padding:14px 14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h h3{font-size:14.5px;font-weight:700}
.panel-h span{font-size:12.5px;color:var(--muted)}
.panel-empty{padding:6px 0 2px;font-size:13.5px;color:var(--muted)}
.ok-note{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.ok-note .ic{color:var(--good)}
.need-list{display:grid}
.need-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.need-row:first-child{border-top:0;padding-top:2px}
.need-row:hover .need-name{text-decoration:underline;text-underline-offset:3px}
.need-mid{display:grid;gap:6px;min-width:0}
.need-name{font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.need-sub{font-size:12.5px;color:var(--muted)}
.need-q{text-align:right;font-size:17px;font-weight:600;line-height:1.2}
.need-q small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--warn-bg)}
.meter>i{display:block;height:100%;min-width:3px;border-radius:4px 4px 4px 4px;background:var(--warn)}
.meter.crit{background:var(--crit-bg)}
.meter.crit>i{background:var(--crit)}
.meter::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:6px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative;min-height:190px}
.chart svg{display:block;max-width:100%;overflow:visible;touch-action:pan-y}
.chart svg:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:6px}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .bar-in{fill:var(--in)}
.chart .bar-out{fill:var(--out)}
.chart .hl{fill:var(--hl)}
.chart .hit{fill:transparent}
.tip{position:absolute;top:0;left:0;z-index:3;min-width:132px;padding:9px 11px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);box-shadow:var(--shadow-2);font-size:12.5px;pointer-events:none}
.tip-h{margin-bottom:5px;font-weight:600;color:var(--ink)}
.tip-r{display:flex;align-items:center;gap:8px;color:var(--ink-2);line-height:1.6}
.tip-r b{min-width:2.4em;text-align:right;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.tip .key{width:12px;height:2px;border-radius:1px;flex:none}
.hbars{display:grid;gap:13px}
.hbar{display:grid;gap:5px;min-width:0}
.hbar-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13.5px}
.hbar-name{min-width:0;overflow-wrap:anywhere;color:var(--ink);font-weight:500}
.hbar-sub{flex:none;font-size:12px;color:var(--muted)}
.hbar-row{display:flex;align-items:center;gap:8px;border-left:1px solid var(--axis)}
.hbar-fill{flex:none;height:10px;min-width:2px;width:calc((100% - 84px) * var(--p));border-radius:0 4px 4px 0}
.hbar-val{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-actions{display:flex;flex-wrap:wrap;gap:8px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.dbt{width:100%;min-width:760px;border-collapse:collapse;font-size:13.5px}
.dbt th{padding:0;border-bottom:1px solid var(--line-2);background:var(--surface-2);text-align:left;white-space:nowrap}
.dbt th button{display:inline-flex;align-items:center;gap:4px;width:100%;padding:10px 10px;border:0;background:none;color:var(--ink-2);font-size:12.5px;font-weight:600;text-align:inherit}
.dbt th.n button{justify-content:flex-end}
.dbt th[aria-sort] button{color:var(--ink)}
.dbt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.dbt td.nm{white-space:normal}
.dbt td.code{overflow-wrap:normal}
.dbt tr:last-child td{border-bottom:0}
.dbt tbody tr{cursor:pointer}
.dbt tbody tr:hover td,.dbt tbody tr:focus-visible td{background:var(--surface-2)}
.dbt tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.dbt .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dbt .nm{font-weight:600;min-width:12em}
.dbt .code{font-size:12px}

/* ---------- login gate ---------- */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow-y:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy)}
.gate-card{display:grid;gap:14px;width:100%;max-width:400px;padding:26px 22px 22px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-2)}
.gate-mark{width:48px;height:48px;border-radius:14px}
.gate-title{font-size:24px;font-weight:700;line-height:1.2}
.gate-sub{margin-top:-8px;font-size:14px;color:var(--ink-2)}
.gate .btn{width:100%}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px}
</style>

</head>
<body>
<div id="app">
  <section class="view" id="v-stock" hidden>
    <header class="hero"><div class="hero-inner">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="12" width="7.5" height="7.5" rx="1.3"/><rect x="13" y="12" width="7.5" height="7.5" rx="1.3"/><rect x="8.25" y="4" width="7.5" height="7.5" rx="1.3"/></svg></span>
          <div><h1 class="brand-name">HQ Stock</h1><p class="brand-sub">คลังอุปกรณ์สำนักงานใหญ่</p></div>
        </div>
        <button type="button" class="icon-btn on-navy" data-act="settings" aria-label="ตั้งค่า"><svg class="ic" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      </div>
      <div class="hero-stats" id="stock-stats" aria-live="polite"></div>
    </div></header>
    <div class="bar"><div class="bar-inner">
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <label for="q" class="sr">ค้นหาในสต็อก</label>
        <input id="q" type="search" placeholder="ค้นหาชื่อ รหัส หรือที่เก็บ" autocomplete="off" enterkeyhint="search">
        <button type="button" class="icon-btn" id="q-clear" aria-label="ล้างคำค้น" hidden><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="chips" id="stock-chips" role="group" aria-label="ตัวกรองสต็อก"></div>
    </div></div>
    <div class="wrap"><div class="wrap-inner">
      <div id="stock-banner"></div>
      <div class="list-head" id="stock-head" hidden>
        <span id="stock-count" class="num"></span>
        <span class="select-wrap"><label for="sort" class="sr">เรียงลำดับ</label>
          <select id="sort" class="select-mini">
            <option value="name">เรียงตามชื่อ</option>
            <option value="low">คงเหลือน้อยก่อน</option>
            <option value="recent">เคลื่อนไหวล่าสุด</option>
          </select></span>
      </div>
      <div id="stock-list"></div>
    </div></div>
  </section>

  <section class="view" id="v-history" hidden>
    <header class="hero"><div class="hero-inner">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
          <div><h1 class="brand-name">ประวัติ</h1><p class="brand-sub" id="hist-sub">รับเข้า เบิกออก และปรับยอดทุกครั้ง</p></div>
        </div>
        <button type="button" class="icon-btn on-navy" data-act="settings" aria-label="ตั้งค่า"><svg class="ic" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      </div>
    </div></header>
    <div class="bar"><div class="bar-inner">
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <label for="hq" class="sr">ค้นหาประวัติ</label>
        <input id="hq" type="search" placeholder="ค้นหาชื่อของ ปลายทาง หรือผู้เบิก" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="chips" id="hist-chips" role="group" aria-label="ประเภทรายการ"></div>
    </div></div>
    <div class="wrap"><div class="wrap-inner">
      <div id="hist-banner"></div>
      <div id="hist-list"></div>
    </div></div>
  </section>

  <section class="view" id="v-dash" hidden>
    <header class="hero"><div class="hero-inner">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-4M12 16V6M17 16v-7"/></svg></span>
          <div><h1 class="brand-name">Dashboard</h1><p class="brand-sub">ภาพรวมและฐานข้อมูลคลัง HQ</p></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ESC[c]);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));
const NF = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 2 });
const fmt = n => NF.format(Number(n) || 0);
const fmtSigned = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + NF.format(Math.abs(n));
const norm = s => str(s).toLowerCase().replace(/\s+/g, ' ').trim();
const toInt = v => { const s = str(v).trim(); return /^\d{1,7}$/.test(s) ? parseInt(s, 10) : NaN; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem('hqstock.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hqstock.' + k, JSON.stringify(v)); } catch (e) { /* per-viewer convenience only */ } },
};
const D_DAY = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
const D_DM = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short' });
const D_DMY2 = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });

const D_WD = new Intl.DateTimeFormat('th-TH', { weekday: 'short' });
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); };
function dayLabel(ts) {
  const t0 = startOfDay(Date.now()), d0 = startOfDay(ts);
  if (d0 === t0) return 'วันนี้';
  if (d0 === addDays(t0, -1)) return 'เมื่อวาน';
  return D_DAY.format(ts);
}
function relTime(ts) {

}
const isoLocal = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

/* ================= icons ================= */
const P = {

  in: '<path d="M12 3.5v10M7.5 9.5 12 14l4.5-4.5"/><path d="M4 14.5v3.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5"/>',
  out: '<path d="M12 14V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14.5v3.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5"/>',
  adj: '<rect x="5.5" y="4.5" width="13" height="16" rx="2"/><path d="M9 4.5V3h6v1.5M9 12.5l2 2 4-4"/>',

  camera: '<path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3V19H4z"/><circle cx="12" cy="13.2" r="3.4"/>',
  image: '<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-5-5-8 8"/>',

  download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/>',

};
const svg = (name, size, sw) => `<svg class="ic" viewBox="0 0 24 24" width="${size || 20}" height="${size || 20}" fill="none" stroke="currentColor" stroke-width="${sw || 1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[name]}</svg>`;
const stIcon = st => (st === 'low'
  ? '<svg class="st" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7.2" class="st-warn"/><path d="M8 4.2v4.7M8 11.5v.2" stroke="#3A2A00" stroke-width="1.9" stroke-linecap="round"/></svg>'
  : '<svg class="st" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7.2" class="st-crit"/><path d="M5.7 5.7l4.6 4.6M10.3 5.7l-4.6 4.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>');

/* ================= domain ================= */
const ST_LABEL = { low: 'ใกล้หมด', out: 'หมด', neg: 'ติดลบ', ok: 'ปกติ' };
const SEV = { neg: 0, out: 1, low: 2, ok: 3 };
const pill = st => `<span class="pill ${st}">${stIcon(st)}${ST_LABEL[st]}</span>`;
const TYPE = {
  open: { label: 'ยอดยกมา', icon: 'open' },
  in: { label: 'รับเข้า', icon: 'in' },
  out: { label: 'เบิกออก', icon: 'out' },
  adj: { label: 'ปรับยอด', icon: 'adj' },
};
const UNITS = ['ชิ้น', 'ชุด', 'อัน', 'ตัว', 'เครื่อง', 'กล่อง', 'แพ็ก', 'ม้วน', 'เส้น', 'แผ่น', 'คู่', 'ใบ'];
function delta(e) {
  const q = Number(e.qty) || 0;
  if (e.type === 'out') return -Math.abs(q);
  if (e.type === 'adj') return q;
  return Math.abs(q);
}
function status(i) {
  if (i.qty < 0) return 'neg';
  if (i.qty === 0) return 'out';
  if (i.min > 0 && i.qty <= i.min) return 'low';
  return 'ok';
}
const ratio = i => (i.min > 0 ? i.qty / i.min : i.qty);

/* ================= state ================= */
const TABS = { stock: 'stock', history: 'history', dash: 'dash', dashboard: 'dash' };
const S = {
  conn: 'loading', auth: null, me: null, connWarn: false, connErr: null,
  lastWriteDone: 0, syncedAt: 0, sheetUrl: '',
  raw: new Map(), cats: {}, itemsReady: false, catsReady: false,
  items: [], byId: new Map(), entries: [],
  scroll: {}, bins: null,
  v: {
    tab: TABS[location.hash.replace('#', '')] || store.get('tab', 'stock'),
    q: '', cat: 'all', need: false, sort: store.get('sort', 'name'),
    hType: 'all', hQ: '', hLimit: 120, hConfirm: null,
    range: store.get('range', 30), tSort: { k: 'name', dir: 1 },
  },
};
if (!['stock', 'history', 'dash'].includes(S.v.tab)) S.v.tab = 'stock';
if (![7, 30, 90].includes(S.v.range)) S.v.range = 30;
if (!['name', 'low', 'recent'].includes(S.v.sort)) S.v.sort = 'name';
const canWrite = () => S.conn === 'ok';

function recompute() {
  const items = [], all = [];
  for (const [id, d] of S.raw) {
    const log = d && d.log && typeof d.log === 'object' ? d.log : {};
    const entries = [];
    let qty = 0, lastAt = Number(d.updatedAt) || Number(d.createdAt) || 0;
    for (const eid of Object.keys(log)) {
      const e = log[eid];
      if (!e || typeof e !== 'object') continue;
      const en = {
        id: eid, itemId: id, type: TYPE[e.type] ? e.type : 'in', qty: Number(e.qty) || 0, at: Number(e.at) || 0,
        by: str(e.by), to: str(e.to), from: str(e.from), person: str(e.person), note: str(e.note),
        count: e.count == null || !Number.isFinite(Number(e.count)) ? null : Number(e.count), void: !!e.void,
      };
      entries.push(en);
      if (!en.void) qty += delta(en);
      if (en.at > lastAt) lastAt = en.at;
    }
    entries.sort((a, b) => a.at - b.at || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const it = {
      id, name: str(d.name) || '(ไม่มีชื่อ)', code: str(d.code), cat: str(d.cat), unit: str(d.unit) || 'ชิ้น',
      min: Math.max(0, Number(d.min) || 0), loc: str(d.loc), note: str(d.note),
      photo: str(d.photo) || null, thumb: str(d.thumb) || null, deleted: !!d.deleted, deletedAt: Number(d.deletedAt) || 0,
      createdAt: Number(d.createdAt) || 0, createdBy: str(d.createdBy), lastAt, qty, entries,
    };
    for (const en of entries) { en.item = it; all.push(en); }
    items.push(it);
  }
  all.sort((a, b) => b.at - a.at || (a.id < b.id ? 1 : a.id > b.id ? -1 : 0));
  S.items = items;
  S.byId = new Map(items.map(i => [i.id, i]));
  S.entries = all;
}
function catList(includeHidden) {
  return Object.keys(S.cats).map(id => {
    const c = S.cats[id] && typeof S.cats[id] === 'object' ? S.cats[id] : {};
    return { id, name: str(c.name) || 'หมวดไม่มีชื่อ', order: Number(c.order) || 0, hidden: !!c.hidden };
  }).filter(c => includeHidden || !c.hidden)
    .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'th'));
}
const catName = id => (id && S.cats[id] && S.cats[id].name ? str(S.cats[id].name) : 'ไม่ระบุหมวด');
const catKey = i => (i.cat && S.cats[i.cat] ? i.cat : '_none');

/* ================= backend: Google Apps Script web app ================= */
const API_URL = /^https:\/\/script\.google(usercontent)?\.com\//.test(window.HQ_API_URL || '') ? window.HQ_API_URL : '';
let busyWrites = 0, pollTimer = 0, syncing = false;
async function api(action, payload, auth) {
  const a = auth || S.auth;
  if (!API_URL) throw { code: 'no_api' };
  const started = Date.now();
  let res, data;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, pin: a && a.pin, by: a && a.name }, payload || {})) });
  } catch (e) { throw { code: 'network' }; }
  try { data = await res.json(); } catch (e) { throw { code: 'server' }; }
  if (!data || !data.ok) throw { code: (data && data.error) || 'server', message: data && data.message };
  // a poll that started before the latest write finished would roll the screen back: skip it
  if (data.state && !(action === 'state' && started < S.lastWriteDone)) applyState(data.state);
  return data;
}
function applyState(st) {
  const logs = {};
  for (const e of st.log || []) (logs[e.itemId] = logs[e.itemId] || {})[e.id] = e;
  const m = new Map();
  for (const it of st.items || []) m.set(it.id, Object.assign({}, it, { log: logs[it.id] || {} }));
  S.raw = m;
  S.cats = st.cats && typeof st.cats === 'object' ? st.cats : {};
  S.sheetUrl = str(st.sheetUrl);
  S.itemsReady = true;
  S.catsReady = true;
  S.syncedAt = Date.now();
  recompute();
  scheduleRender();
}
async function mutate(action, payload) {
  if (!canWrite()) throw { code: 'read_only' };
  busyWrites++;
  try {
    const r = await api(action, payload);
    S.lastWriteDone = Date.now();
    return r;
  } finally { busyWrites--; }
}
async function connect() {
  if (!API_URL) { S.conn = 'nosetup'; renderAll(); return; }
  S.auth = store.get('auth', null);
  if (!S.auth || !S.auth.name || !S.auth.pin) { S.conn = 'login'; renderAll(); showGate(''); return; }
  S.me = S.auth.name;
  try {
    await api('state');
    S.conn = 'ok'; S.connWarn = false;
    renderAll();
    startPolling();
  } catch (e) {
    if (e.code === 'bad_pin' || e.code === 'no_name') { logout('PIN ของทีมเปลี่ยนแล้ว ใส่ PIN ใหม่'); return; }
    S.conn = 'error'; S.connErr = e;
    renderAll();
    setTimeout(connect, 10000);
  }
}
function startPolling() { clearInterval(pollTimer); pollTimer = setInterval(sync, 20000); }
async function sync() {
  if (syncing || document.hidden || S.conn !== 'ok' || busyWrites) return;
  syncing = true;
  try {
    await api('state');
    if (S.connWarn) { S.connWarn = false; scheduleRender(); }
  } catch (e) {
    if (e.code === 'bad_pin') logout('PIN ของทีมเปลี่ยนแล้ว ใส่ PIN ใหม่');
    else if (!S.connWarn) { S.connWarn = true; scheduleRender(); }
  } finally { syncing = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
function showGate(msg) {
  const g = $('#gate');
  g.hidden = false;
  $('#g-err').textContent = msg || '';
  const saved = store.get('lastName', '');
  if (saved && !$('#g-name').value) $('#g-name').value = saved;
  setTimeout(() => { ($('#g-name').value ? $('#g-pin') : $('#g-name')).focus(); }, 60);
}
function logout(msg) {
  clearInterval(pollTimer);
  closeSheets();
  store.set('auth', null);
  S.auth = null; S.me = null; S.conn = 'login';
  S.raw = new Map(); S.itemsReady = false; recompute();
  renderAll();
  showGate(msg || '');
}
$('#gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#g-name').value.trim().slice(0, 60), pin = $('#g-pin').value.trim();
  const err = $('#g-err'), btn = $('#g-go');
  if (!name) { err.textContent = 'ใส่ชื่อของคุณ ระบบจะใช้ชื่อนี้บันทึกในประวัติ'; $('#g-name').focus(); return; }
  if (!pin) { err.textContent = 'ใส่ PIN ของทีม'; $('#g-pin').focus(); return; }
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…'; err.textContent = '';
  try {
    const auth = { name, pin };
    await api('state', null, auth);
    S.auth = auth; S.me = name; S.conn = 'ok'; S.connWarn = false;
    store.set('auth', auth); store.set('lastName', name);
    $('#gate').hidden = true; $('#g-pin').value = '';
    renderAll();
    startPolling();
  } catch (ex) {
    err.textContent = ex.code === 'bad_pin' ? 'PIN ไม่ถูกต้อง' : errMsg(ex);
  } finally { btn.disabled = false; btn.textContent = 'เข้าใช้งาน'; }
});
const ERR = {
  read_only: 'ยังเชื่อมต่อไม่ได้ บันทึกไม่ได้ตอนนี้',
  network: 'ต่ออินเทอร์เน็ตไม่ได้ ตรวจสอบสัญญาณแล้วลองใหม่',
  server: 'เซิร์ฟเวอร์ตอบกลับผิดพลาด ลองใหม่อีกครั้ง',
  no_api: 'ยังไม่ได้ตั้งค่า HQ_API_URL ใน index.html',
  not_setup: 'ยังไม่ได้รัน setup() ใน Apps Script',
  busy: 'มีคนบันทึกพร้อมกันอยู่ ลองใหม่อีกครั้ง',
  locked: 'ใส่ PIN ผิดหลายครั้ง รอ 10 นาทีแล้วลองใหม่',
  too_large: 'รูปใหญ่เกินไป ลองเลือกรูปอื่น',
  unsupported_type: 'ไฟล์นี้ไม่ใช่รูปที่รองรับ ลองเลือกไฟล์ JPG หรือ PNG',
  decode: 'เปิดไฟล์รูปนี้ไม่ได้ ลองเลือกไฟล์ JPG หรือ PNG',
  invalid_name: 'ใส่ชื่อหมวดก่อน',
};
const errMsg = e => ERR[e && e.code] || (e && e.message) || 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';

/* ================= photos ================= */
async function decodeImage(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* fall back */ }
  }
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ code: 'decode' }); };
    img.src = url;
  });
}
function encodeJpeg(img, max, quality) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const k = Math.min(1, max / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cw, ch);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, cw, ch);
  return new Promise((resolve, reject) => c.toBlob(b => (b ? resolve(b) : reject({ code: 'decode' })), 'image/jpeg', quality));
}

/* ================= render: dashboard ================= */
function rangeData() {
  const R = S.v.range, today0 = startOfDay(Date.now());
  const bins = [];
  if (R <= 31) {
    for (let k = R - 1; k >= 0; k--) {
      const s = addDays(today0, -k);
      bins.push({ start: s, end: addDays(s, 1), in: 0, out: 0, lab: R <= 7 ? D_WD.format(s) : D_DM.format(s), title: dayLabel(s) });
    }
  } else {
    const nb = Math.ceil(R / 7);
    for (let k = nb - 1; k >= 0; k--) {
      const e = addDays(today0, 1 - 7 * k), s = addDays(e, -7);
      bins.push({ start: s, end: e, in: 0, out: 0, lab: D_DM.format(s), title: `${D_DM.format(s)} – ${D_DM.format(addDays(e, -1))}` });
    }
  }
  const from = bins[0].start, to = bins[bins.length - 1].end;
  const T = { inQ: 0, inN: 0, outQ: 0, outN: 0, adjN: 0 };
  const byItem = new Map(), byDest = new Map();
  for (const e of S.entries) {
    if (e.at < from) break;
    if (e.void || e.at >= to) continue;
    if (e.type === 'adj') { T.adjN++; continue; }
    if (e.type !== 'in' && e.type !== 'out') continue;
    let b = null;
    for (let j = bins.length - 1; j >= 0; j--) if (e.at >= bins[j].start) { b = bins[j]; break; }
    if (!b) continue;
    if (e.type === 'in') { b.in += e.qty; T.inQ += e.qty; T.inN++; }
    else {
      b.out += e.qty; T.outQ += e.qty; T.outN++;
      const it = byItem.get(e.itemId) || { name: e.item.name, unit: e.item.unit, v: 0, n: 0 };
      it.v += e.qty; it.n++; byItem.set(e.itemId, it);
      const key = norm(e.to) || '_';
      const d = byDest.get(key) || { name: e.to || 'ไม่ระบุปลายทาง', v: 0, n: 0 };
      d.v += e.qty; d.n++; byDest.set(key, d);
    }
  }
  const top = m => [...m.values()].sort((a, b) => b.v - a.v || b.n - a.n).slice(0, 5);
  return { bins, T, topItems: top(byItem), topDest: top(byDest) };
}

function renderDash() {
  $('#dash-banner').innerHTML = bannerHtml();
  const act = S.items.filter(i => !i.deleted);

  const catsUsed = new Set(act.map(catKey)).size;

  const body = $('#dash-body');

  /* stock status */

  const need = [...outs, ...low].sort((a, b) => SEV[status(a)] - SEV[status(b)] || ratio(a) - ratio(b));
  const needRows = need.slice(0, 8).map(i => {

}

  return `M${f(x)},${f(yBase)}V${f(yEnd - r)}Q${f(x)},${f(yEnd)} ${f(x + r)},${f(yEnd)}H${f(x + w - r)}Q${f(x + w)},${f(yEnd)} ${f(x + w)},${f(yEnd - r)}V${f(yBase)}Z`;
}
function drawFlow() {
  const el = $('#flow-chart');

  const W = Math.max(260, Math.floor(el.clientWidth || 320));
  const H = 196, padL = 34, padR = 4, padT = 8, axH = 24, plotH = H - padT - axH;
  const maxV = Math.max(0, ...bins.map(b => Math.max(b.in, b.out)));

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img" aria-label="กราฟรับเข้าและเบิกออก ${S.v.range} วันล่าสุด ใช้ปุ่มลูกศรซ้ายขวาเพื่ออ่านค่า">`;
  s += `<rect class="hl" x="0" y="${padT}" width="${band.toFixed(1)}" height="${plotH}" visibility="hidden"/>`;
  for (const v of [M, M / 2, -M / 2, -M]) {
    const y = (y0 - v * k).toFixed(1);

  }
  s += `<text class="ax" x="${padL - 7}" y="${(y0 + 3.5).toFixed(1)}" text-anchor="end">0</text>`;

    if (b.out > 0) s += `<path class="bar-out" d="${barPath(x, y0 + 1, bw, Math.max(1.5, b.out * k), 1)}"/>`;

    const tx = anchor === 'start' ? padL + band * i : anchor === 'end' ? padL + band * (i + 1) : cx;

    tip.innerHTML = `<div class="tip-h"></div><div class="tip-r"><span class="key" style="background:var(--in)"></span><b>${fmt(b.in)}</b><span>รับเข้า</span></div><div class="tip-r"><span class="key" style="background:var(--out)"></span><b>${fmt(b.out)}</b><span>เบิกออก</span></div>`;
    tip.firstChild.textContent = b.title;
    tip.hidden = false;
    const scale = sv.getBoundingClientRect().width / W || 1;
    const cx = (padL + band * i + band / 2) * scale;

  sv.addEventListener('pointerdown', ev => show(pick(ev)));

    } else if (ev.key === 'Escape') hide();

}

function movePreview(p) {
  const i = S.byId.get(p.id);
  const pv = $('#m-preview', sheetEl), btn = $('#m-save', sheetEl), er = $('#m-err', sheetEl), cur = $('#m-cur', sheetEl);

    else {
      const d = c - i.qty;
      pv.innerHTML = d === 0 ? `ตรงกับยอดในระบบ (${fmt(i.qty)} ${u})` : `ส่วนต่าง <b>${fmtSigned(d)}</b> ${u} · คงเหลือใหม่ <b>${fmt(c)}</b> ${u}`;

    }

    if (!(q >= 1)) { ok = false; msg = 'ใส่จำนวนอย่างน้อย 1'; }
    else if (p.type === 'out' && q > Math.max(0, i.qty)) { ok = false; msg = i.qty > 0 ? `เบิกได้ไม่เกิน ${fmt(i.qty)} ${i.unit}` : 'ของหมดแล้ว ต้องรับเข้าหรือปรับยอดก่อนเบิก'; }
    else pv.innerHTML = `คงเหลือหลังบันทึก <b class="num">${fmt(i.qty + (p.type === 'out' ? -q : q))}</b> ${u}`;
    btn.textContent = `${p.type === 'out' ? 'บันทึกเบิกออก' : 'บันทึกรับเข้า'}${q >= 1 ? ` ${fmt(q)} ${i.unit}` : ''}`;
  }
  if (!ok) pv.innerHTML = '';

function openMove(id, type) {
  const i = S.byId.get(id);
  if (!i || !canWrite()) return;
  openSheet('move', { id, type, qty: '1', count: String(Math.max(0, i.qty)), to: '', person: '', from: '', note: '' });
}
async function saveMove(p) {
  if (p.saving) return;
  const i = S.byId.get(p.id);
  if (!i) return;
  const entry = { type: p.type };
  if (p.type === 'adj') {
    const c = toInt(p.count);
    if (!(c >= 0)) return;
    entry.count = c;
    entry.qty = c - i.qty;
  } else {
    const q = toInt(p.qty);
    if (!(q >= 1) || (p.type === 'out' && q > Math.max(0, i.qty))) return;
    entry.qty = q;
    if (p.type === 'out') {
      const to = str(p.to).trim(), person = str(p.person).trim();
      if (to) entry.to = to.slice(0, 80);
      if (person) entry.person = person.slice(0, 80);
    } else {
      const from = str(p.from).trim();
      if (from) entry.from = from.slice(0, 80);
    }
  }
  const note = str(p.note).trim();
  if (note) entry.note = note.slice(0, 300);
  p.saving = true; p.err = ''; movePreview(p);
  try {
    const res = await mutate('move', { id: i.id, entry });
    const eid = res.entryId;
    if (p.type === 'adj') entry.qty = res.delta;
    p.saving = false;
    backSheet();
    const msg = p.type === 'adj'
      ? (entry.qty === 0 ? `ตรวจนับ ${i.name} ตรงยอด` : `ปรับยอด ${i.name} เป็น ${fmt(entry.count)} ${i.unit}`)
      : `${TYPE[p.type].label} ${fmt(entry.qty)} ${i.unit} · ${i.name}`;
    toast(msg, { label: 'เลิกทำ', fn: () => voidEntry(i.id, eid) });
  } catch (e) {
    p.saving = false; p.err = errMsg(e); movePreview(p);
  }
}
async function voidEntry(itemId, eid) {

  } catch (e) { toast(errMsg(e)); }
}

const saveCats = next => mutate('saveCats', { cats: next });
async function addCategory(raw) {
  const name = str(raw).trim().slice(0, 40);
  if (!name) throw { code: 'invalid_name' };
  const found = catList(true).find(c => norm(c.name) === norm(name));
  const next = catsCopy();
  if (found) {
    if (found.hidden) { delete next[found.id].hidden; await saveCats(next); }
    return found.id;
  }
  const id = 'c' + Date.now().toString(36);
  next[id] = { name, order: Math.max(0, ...Object.values(next).map(c => c.order || 0)) + 1 };
  await saveCats(next);
  return id;
}
SHEETS.settings = {
  live: true,
  render(p) {
    const w = canWrite();
    const counts = {};
    for (const i of S.items) if (!i.deleted) counts[i.cat] = (counts[i.cat] || 0) + 1;
    const all = catList(true), vis = all.filter(c => !c.hidden), hid = all.filter(c => c.hidden);
    const del = S.items.filter(i => i.deleted).sort((a, b) => b.deletedAt - a.deletedAt);
    const catRows = vis.map(c => `<div class="cat-row"><input class="input" data-catname="${esc(c.id)}" maxlength="40" value="${esc(c.name)}" aria-label="ชื่อหมวด ${esc(c.name)}"${w ? '' : ' disabled'}>`
      + `<span class="muted small num">${fmt(counts[c.id] || 0)} รายการ</span>`
      + (w ? `<button type="button" class="btn sm" data-act="cat-hide" data-cat="${esc(c.id)}"${counts[c.id] ? ' disabled title="ย้ายรายการออกจากหมวดนี้ก่อน"' : ''}>ซ่อน</button>` : '') + '</div>').join('');
    return sheetHead('ตั้งค่า') + `<div class="sheet-scroll"><div class="stack">
<section class="stack"><h3 class="d-h">หมวดหมู่</h3>
<div class="cat-list">${catRows || '<p class="muted small">ยังไม่มีหมวดหมู่ เพิ่มหมวดแรกด้านล่าง</p>'}</div>
${w ? `<div class="cat-add"><input class="input" id="cat-new" maxlength="40" placeholder="ชื่อหมวดใหม่" aria-label="ชื่อหมวดใหม่" value="${esc(p.newCat)}" enterkeyhint="done"><button type="button" class="btn" data-act="cat-add">เพิ่มหมวด</button></div>` : ''}
${hid.length ? `<p class="small muted">หมวดที่ซ่อนไว้: ${hid.map(c => `<button type="button" class="link" data-act="cat-show" data-cat="${esc(c.id)}">${esc(c.name)} (แสดงอีกครั้ง)</button>`).join(' ')}</p>` : ''}
<p class="hint">แก้ชื่อหมวดได้ทันที ระบบบันทึกเมื่อกดออกจากช่อง หมวดที่ยังมีรายการอยู่ซ่อนไม่ได้</p>
</section>
<section class="stack"><h3 class="d-h">รายการที่ลบแล้ว</h3>
${del.length ? `<div class="del-list">${del.map(i => `<div class="del-row" data-id="${esc(i.id)}">${thumbHtml(i, 40)}<div class="del-t"><div class="del-name">${esc(i.name)}</div><div class="muted small">ลบเมื่อ ${i.deletedAt ? esc(D_DAY.format(i.deletedAt)) : '—'}</div></div>${w ? `<button type="button" class="btn sm" data-act="restore">${svg('restore', 18)}กู้คืน</button>` : ''}</div>`).join('')}</div>` : '<p class="muted small">ไม่มีรายการที่ลบ</p>'}
</section>
<section class="stack"><h3 class="d-h">บัญชีบนเครื่องนี้</h3>
<div class="acct"><span>ใช้งานในชื่อ <b>${esc(S.me || '—')}</b></span><button type="button" class="btn sm" data-act="logout">ออกจากระบบ</button></div>
<p class="hint">ชื่อนี้จะถูกบันทึกในประวัติทุกครั้งที่รับเข้าหรือเบิกออกจากเครื่องนี้</p>
</section>
<section class="stack"><h3 class="d-h">เกี่ยวกับข้อมูล</h3>
<p class="small muted">ข้อมูลทั้งหมดเก็บใน Google Sheet และรูปเก็บใน Google Drive แอปดึงข้อมูลใหม่ทุก 20 วินาที ยอดคงเหลือคำนวณจากประวัติรับเข้า เบิกออก และปรับยอด จึงย้อนตรวจได้ทุกครั้ง${S.syncedAt ? ` · ซิงก์ล่าสุด ${esc(D_TIME.format(S.syncedAt))}` : ''}</p>
${S.sheetUrl ? `<a class="link" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">เปิด Google Sheet (เฉพาะคนที่มีสิทธิ์)</a>` : ''}
</section>
</div></div>`;
  },
  mount(p) {
    const nc = $('#cat-new', sheetEl);
    if (nc) {
      nc.addEventListener('input', () => { p.newCat = nc.value; });
      nc.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAddCat(p); } });
    }
  },
};
async function doAddCat(p) {
  const name = str(p.newCat).trim();
  if (!name) { const el = $('#cat-new', sheetEl); if (el) el.focus(); return; }
  try { await addCategory(name); p.newCat = ''; toast(`เพิ่มหมวด “${name}” แล้ว`); drawSheet(false); } catch (e) { toast(errMsg(e)); }
}
async function renameCat(id, raw) {
  const name = str(raw).trim().slice(0, 40);
  if (!S.cats[id] || !name || name === str(S.cats[id].name)) return;
  const next = catsCopy();
  next[id].name = name;
  try { await saveCats(next); toast('บันทึกชื่อหมวดแล้ว'); } catch (e) { toast(errMsg(e)); }
}
async function setCatHidden(id, hidden) {
  const next = catsCopy();
  if (!next[id]) return;
  if (hidden) next[id].hidden = true; else delete next[id].hidden;
  try { await saveCats(next); } catch (e) { toast(errMsg(e)); }
}
async function softDelete(id) {
  try {
    await mutate('deleteItem', { id });
    closeSheets();
    toast('ลบรายการแล้ว', { label: 'กู้คืน', fn: () => restore(id) });
  } catch (e) { toast(errMsg(e)); }
}
async function restore(id) {
  try {
    await mutate('restoreItem', { id });
    toast('กู้คืนรายการแล้ว');
  } catch (e) { toast(errMsg(e)); }
}
async function detailPhoto(file, id) {
  const t = top();
  if (!t) return;
  t.props.uploading = true;
  drawSheet(false);
  try {
    await mutate('updateItem', { id, photo: await encodePhoto(file) });
    toast('เพิ่มรูปแล้ว');
  } catch (e) {
    toast(errMsg(e));
  } finally {
    t.props.uploading = false;
    if (top() === t) drawSheet(false);
  }
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-sheet]')) { backSheet(); return; }
  const step = t.closest('[data-step]');
  if (step) {
    const inp = document.getElementById(step.dataset.for);
    if (!inp) return;
    const min = inp.id === 'm-qty' ? 1 : 0;
    const cur = toInt(inp.value);
    inp.value = String(Math.max(min, (Number.isFinite(cur) ? cur : min) + Number(step.dataset.step)));
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    return;
  }
  const mt = t.closest('[data-mtype]');
  if (mt) { const s = top(); if (s && s.kind === 'move') { s.props.type = mt.dataset.mtype; s.props.err = ''; drawSheet(false); } return; }
  const chip = t.closest('[data-chip]');
  if (chip) {
    const k = chip.dataset.chip;
    if (k === 'need') S.v.need = !S.v.need;
    else if (k === 'cat') S.v.cat = chip.dataset.cat;
    else if (k === 'htype') S.v.hType = chip.dataset.type;
    if (k === 'htype') renderHistory(); else renderStock();
    resolveNames();
    return;
  }
  const rg = t.closest('[data-range]');
  if (rg) { S.v.range = Number(rg.dataset.range); store.set('range', S.v.range); renderDash(); return; }
  const ts = t.closest('[data-tsort]');
  if (ts) {
    const k = ts.dataset.tsort;
    S.v.tSort = S.v.tSort.k === k ? { k, dir: -S.v.tSort.dir } : { k, dir: k === 'last' || k === 'qty' ? -1 : 1 };
    renderDash();
    return;
  }
  const tab = t.closest('[data-tab]');
  if (tab) { setTab(tab.dataset.tab); return; }
  const a = t.closest('[data-act]');
  if (!a) return;
  const ctx = a.closest('[data-id]');
  const id = a.dataset.id || (ctx && ctx.dataset.id);
  const s = top();
  switch (a.dataset.act) {
    case 'open': if (id) openSheet('detail', { id }); break;
    case 'in': case 'out': case 'adj': if (id) openMove(id, a.dataset.act); break;
    case 'new': if (canWrite()) openSheet('form', formProps(null)); break;
    case 'edit': { const i = S.byId.get(id); if (i && canWrite()) openSheet('form', formProps(i)); break; }
    case 'settings': openSheet('settings', { newCat: '' }); break;
    case 'm-save': if (s && s.kind === 'move') saveMove(s.props); break;
    case 'f-save': if (s && s.kind === 'form') saveForm(s.props); break;
    case 'f-rmphoto':
      if (s && s.kind === 'form') {
        saveFormFields(s.props);
        if (s.props.file) { URL.revokeObjectURL(s.props.preview); s.props.file = null; s.props.preview = ''; } else s.props.removePhoto = true;
        drawSheet(false);
      }
      break;
    case 'del': if (s) { s.props.confirmDel = true; drawSheet(false); } break;
    case 'del-no': if (s) { s.props.confirmDel = false; drawSheet(false); } break;
    case 'del-yes': if (id) softDelete(id); break;
    case 'restore': if (id) restore(id); break;
    case 'card-all': if (s) { s.props.cardAll = true; drawSheet(false); } break;
    case 'cat-add': if (s) doAddCat(s.props); break;
    case 'cat-hide': setCatHidden(a.dataset.cat, true); break;
    case 'cat-show': setCatHidden(a.dataset.cat, false); break;
    case 'h-more': { const row = a.closest('[data-entry]'); S.v.hConfirm = row && S.v.hConfirm !== row.dataset.entry ? row.dataset.entry : null; renderHistory(); resolveNames(); break; }
    case 'h-cancel': S.v.hConfirm = null; renderHistory(); resolveNames(); break;
    case 'h-void': { const row = a.closest('[data-entry]'); if (row && id) voidEntry(id, row.dataset.entry); S.v.hConfirm = null; break; }
    case 'hist-more': S.v.hLimit += 150; renderHistory(); resolveNames(); break;
    case 'clear-hist': S.v.hType = 'all'; S.v.hQ = ''; $('#hq').value = ''; renderHistory(); break;
    case 'clear-filters': S.v.need = false; S.v.cat = 'all'; S.v.q = ''; $('#q').value = ''; $('#q-clear').hidden = true; renderStock(); break;
    case 'goto-need': S.v.need = true; S.v.cat = 'all'; S.v.q = ''; $('#q').value = ''; $('#q-clear').hidden = true; S.scroll.stock = 0; setTab('stock'); break;
    case 'export-items': exportCsv('items'); break;
    case 'export-history': exportCsv('history'); break;
    case 'logout': logout(''); break;
    default: break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-photo="form"]')) {
    const f = t.files && t.files[0];
    const s = top();
    if (!f || !s || s.kind !== 'form') return;
    saveFormFields(s.props);
    if (f.type && !/^image\//.test(f.type)) { s.props.err = ERR.unsupported_type; drawSheet(false); return; }
    if (s.props.preview) URL.revokeObjectURL(s.props.preview);
    s.props.file = f; s.props.preview = URL.createObjectURL(f); s.props.removePhoto = false; s.props.err = '';
    drawSheet(false);
  } else if (t.matches('[data-photo="detail"]')) {
    const f = t.files && t.files[0];
    const s = top();
    if (f && s && s.kind === 'detail') {
      if (f.type && !/^image\//.test(f.type)) { toast(ERR.unsupported_type); return; }
      detailPhoto(f, s.props.id);
    }
  } else if (t.matches('[data-catname]')) {
    renameCat(t.dataset.catname, t.value);
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
});
$('#q').addEventListener('input', e => { S.v.q = e.target.value; $('#q-clear').hidden = !e.target.value; renderStock(); resolveNames(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#q-clear').addEventListener('click', () => { S.v.q = ''; $('#q').value = ''; $('#q-clear').hidden = true; renderStock(); $('#q').focus(); });
$('#sort').addEventListener('change', e => { S.v.sort = e.target.value; store.set('sort', S.v.sort); renderStock(); });
$('#hq').addEventListener('input', e => { S.v.hQ = e.target.value; renderHistory(); resolveNames(); });
$('#hq').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
let rsz = 0, lastW = window.innerWidth;
window.addEventListener('resize', () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; if (S.v.tab === 'dash') drawFlow(); } }, 150);
});

/* ================= boot ================= */
renderAll();
connect();
})();
</script>
